<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StudentAI-ChatBot — Chat</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .chat-layout {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 56px);
    }
    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
    }
    .chat-header-left { display: flex; align-items: center; gap: 10px; }
    .back-link {
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 8px;
      border-radius: 4px;
      transition: all 0.1s;
    }
    .back-link:hover { color: var(--text-primary); background: var(--bg-hover); }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
    }

    .chat-input-area {
      padding: 14px 24px 18px;
      border-top: 1px solid var(--border);
    }
    .chat-input-wrap {
      display: flex;
      gap: 10px;
      max-width: 812px;
      margin: 0 auto;
      align-items: flex-end;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      transition: border-color 0.1s;
    }
    .chat-input-wrap:focus-within { border-color: var(--border-focus); }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      line-height: 1.5;
      max-height: 130px;
      overflow-y: auto;
      padding: 2px 0;
    }
    textarea::placeholder { color: var(--text-muted); }

    #send-btn {
      background: var(--text-primary);
      color: var(--bg-main);
      border: 1px solid var(--text-primary);
      border-radius: 4px;
      width: 34px;
      height: 34px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.1s;
    }
    #send-btn:hover    { background: #27272a; border-color: #27272a; }
    #send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .hint {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 8px;
      max-width: 812px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      flex: 1;
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 0;
      gap: 12px;
    }
    .empty-icon {
      width: 44px; height: 44px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      border: 1px solid var(--border);
      background: var(--bg-card);
    }
    .empty-icon.concept    { border-left: 3px solid var(--concept); }
    .empty-icon.exam       { border-left: 3px solid var(--exam); }
    .empty-icon.cv         { border-left: 3px solid var(--cv); }
    .empty-icon.internship { border-left: 3px solid var(--internship); }

    .empty-state h3 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .empty-state p {
      font-size: 14px;
      color: var(--text-secondary);
      max-width: 420px;
      line-height: 1.5;
    }
    .suggestions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      margin-top: 8px;
    }
    .suggestion-chip {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      text-align: left;
      transition: all 0.1s ease;
      font-family: inherit;
    }
    .suggestion-chip:hover {
      color: var(--text-primary);
      border-color: var(--border-focus);
      background: var(--bg-hover);
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="navbar-brand">StudentAI-ChatBot</div>
    <div class="navbar-links">
      <a href="index.html">Home</a>
      <a href="compare.html">Benchmark</a>
    </div>
  </nav>

  <div class="chat-layout">

    <div class="chat-header">
      <div class="chat-header-left">
        <a href="index.html" class="back-link">← Back</a>
        <span id="mode-badge" class="mode-badge">mode</span>
      </div>
      <button class="btn btn-ghost" onclick="resetChat()" style="font-size:12px;padding:5px 12px">
        New chat
      </button>
    </div>

    <div class="chat-messages" id="messages">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon" id="empty-icon-wrap">
          <span id="empty-icon">✍🏻</span>
        </div>
        <h3 id="empty-title">Concept Explainer</h3>
        <p id="empty-desc">Ask me to explain any CS topic. I'll tailor the explanation to your level.</p>
        <div class="suggestions" id="suggestions"></div>
      </div>
    </div>

    <div class="chat-input-area">
      <div class="chat-input-wrap">
        <input type="file" id="file-input" accept=".pdf" style="display: none;" onchange="updateFileIndicator()" />
        
        <button id="upload-trigger" class="btn" style="height: 28px; padding: 0 10px; margin-right: 4px; font-size: 14px;" onclick="document.getElementById('file-input').click()">+</button>
        
        <textarea
          id="user-input"
          placeholder="Ask anything or attach a PDF..."
          rows="1"
        ></textarea>
        <button id="send-btn" onclick="sendMessage()">➤</button>
      </div>
      <div id="file-status" style="font-size: 11px; color: var(--text-secondary); text-align: center; margin-top: 4px; font-family: monospace; display: none;"></div>
      <div class="hint">Enter to send · Shift+Enter for new line</div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
